<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- d20 face gradient -->
    <linearGradient id="dieFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6a4aae"/>
      <stop offset="100%" stop-color="#3d2b5e"/>
    </linearGradient>
    <linearGradient id="dieFaceLight" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#8a6ace" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3d2b5e" stop-opacity="0"/>
    </linearGradient>

    <!-- scroll gradient -->
    <linearGradient id="scrollParchment" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff5e0"/>
      <stop offset="50%" stop-color="#f0e0c8"/>
      <stop offset="100%" stop-color="#d4c0a0"/>
    </linearGradient>
    <linearGradient id="scrollRoll" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5a3a8e"/>
      <stop offset="50%" stop-color="#4a2d7a"/>
      <stop offset="100%" stop-color="#2a1a4a"/>
    </linearGradient>

    <!-- glow filter -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" in="SourceGraphic" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- ambient glow -->
    <radialGradient id="ambient" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#b388ff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#7c4dff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a1625" stop-opacity="0"/>
    </radialGradient>

    <!-- d20 edge highlight -->
    <linearGradient id="dieEdge" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a080d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5a3a8e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="64" cy="64" r="62" fill="#1a1625"/>
  <circle cx="64" cy="64" r="62" fill="url(#ambient)"/>

  <!-- ambient glow behind die -->
  <ellipse cx="64" cy="40" rx="32" ry="24" fill="#b388ff" opacity="0.12" filter="url(#softGlow)"/>

  <!-- ===== D20 (top) ===== -->
  <!-- outer triangle silhouette -->
  <g filter="url(#glow)">
    <!-- d20 as a hexagonal face with triangular facets -->
    <!-- main face -->
    <polygon points="64,14 88,28 88,52 64,66 40,52 40,28"
             fill="url(#dieFace)" stroke="#8a6ace" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- top-left facet -->
    <polygon points="64,14 40,28 40,52"
             fill="#4a2d7a" opacity="0.5"/>
    <!-- top-right facet -->
    <polygon points="64,14 88,28 88,52"
             fill="#3d2b5e" opacity="0.4"/>
    <!-- bottom-left facet -->
    <polygon points="40,52 64,66 64,40"
             fill="#5a3a8e" opacity="0.3"/>
    <!-- bottom-right facet -->
    <polygon points="88,52 64,66 64,40"
             fill="#4a2d7a" opacity="0.3"/>
    <!-- center facet (front-facing) -->
    <polygon points="64,40 88,52 64,66 40,52"
             fill="url(#dieFaceLight)" opacity="0.7"/>

    <!-- facet edge lines -->
    <line x1="64" y1="14" x2="64" y2="40" stroke="#8a6ace" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="28" x2="64" y2="40" stroke="#8a6ace" stroke-width="1" opacity="0.5"/>
    <line x1="88" y1="28" x2="64" y2="40" stroke="#8a6ace" stroke-width="1" opacity="0.5"/>
    <line x1="64" y1="40" x2="64" y2="66" stroke="#8a6ace" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="52" x2="64" y2="40" stroke="#8a6ace" stroke-width="1" opacity="0.4"/>
    <line x1="88" y1="52" x2="64" y2="40" stroke="#8a6ace" stroke-width="1" opacity="0.4"/>

    <!-- the number 20 on the front face -->
    <text x="64" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="13"
          font-weight="bold" fill="#ffd966" opacity="0.9">20</text>
  </g>

  <!-- ===== Scroll (unfurling from the die) ===== -->
  <!-- scroll body (parchment) -->
  <path d="M 44 60 Q 44 56 48 56 L 80 56 Q 84 56 84 60
           L 86 92 Q 86 96 82 96 L 46 96 Q 42 96 42 92 Z"
        fill="url(#scrollParchment)" stroke="#c8b896" stroke-width="0.8"/>

  <!-- scroll top roll (cylinder) -->
  <ellipse cx="64" cy="58" rx="22" ry="5" fill="url(#scrollRoll)" stroke="#6a4aae" stroke-width="1"/>
  <ellipse cx="64" cy="57" rx="20" ry="3.5" fill="#3d2b5e" opacity="0.6"/>

  <!-- scroll bottom roll (cylinder) -->
  <ellipse cx="64" cy="96" rx="24" ry="5.5" fill="url(#scrollRoll)" stroke="#6a4aae" stroke-width="1"/>
  <ellipse cx="64" cy="95" rx="22" ry="4" fill="#3d2b5e" opacity="0.6"/>

  <!-- scroll end caps -->
  <circle cx="42" cy="58" r="3.5" fill="#5a3a8e" stroke="#8a6ace" stroke-width="1"/>
  <circle cx="86" cy="58" r="3.5" fill="#5a3a8e" stroke="#8a6ace" stroke-width="1"/>
  <circle cx="40" cy="96" r="4" fill="#5a3a8e" stroke="#8a6ace" stroke-width="1"/>
  <circle cx="88" cy="96" r="4" fill="#5a3a8e" stroke="#8a6ace" stroke-width="1"/>

  <!-- scroll text lines (glowing faintly) -->
  <g stroke="#a09080" stroke-width="0.8" opacity="0.4">
    <line x1="48" y1="68" x2="80" y2="68"/>
    <line x1="48" y1="74" x2="76" y2="74"/>
    <line x1="48" y1="80" x2="80" y2="80"/>
    <line x1="48" y1="86" x2="72" y2="86"/>
  </g>

  <!-- glowing runes on the scroll -->
  <g filter="url(#glow)">
    <!-- rune 1: small diamond -->
    <path d="M 56 70 L 58 72 L 56 74 L 54 72 Z" fill="#ffd966" opacity="0.7"/>
    <!-- rune 2: small circle -->
    <circle cx="72" cy="77" r="1.5" fill="#b388ff" opacity="0.7"/>
    <!-- rune 3: tiny star -->
    <path d="M 64 82 L 65 84 L 67 83 L 65 85 L 64 87 L 63 85 L 61 83 L 63 84 Z"
          fill="#ffd966" opacity="0.6"/>
  </g>

  <!-- connecting glow from die to scroll -->
  <ellipse cx="64" cy="62" rx="8" ry="4" fill="#ffd966" opacity="0.15" filter="url(#softGlow)"/>

  <!-- sparkles -->
  <g filter="url(#glow)">
    <circle cx="30" cy="30" r="1.2" fill="#ffd966" opacity="0.5"/>
    <circle cx="98" cy="30" r="1.2" fill="#ffd966" opacity="0.5"/>
    <circle cx="24" cy="50" r="0.8" fill="#b388ff" opacity="0.4"/>
    <circle cx="104" cy="50" r="0.8" fill="#b388ff" opacity="0.4"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b5e"/>
      <stop offset="100%" stop-color="#1e1a2e"/>
    </linearGradient>
    <linearGradient id="pages" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#d4c8b8"/>
    </linearGradient>
    <radialGradient id="runeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#b388ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b388ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1625"/>

  <!-- book - left cover (back) -->
  <path d="M 64 28 Q 40 24 20 30 L 20 32 L 22 34 L 22 98 L 60 100 L 64 96 Z"
        fill="url(#bookCover)" stroke="#4a3a6e" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- book - right cover (front) -->
  <path d="M 64 28 Q 88 24 108 30 L 108 32 L 106 34 L 106 98 L 68 100 L 64 96 Z"
        fill="url(#bookCover)" stroke="#4a3a6e" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- left page -->
  <path d="M 64 30 L 26 33 L 26 96 L 62 98 L 64 96 Z"
        fill="url(#pages)" opacity="0.95"/>

  <!-- right page -->
  <path d="M 64 30 L 102 33 L 102 96 L 66 98 L 64 96 Z"
        fill="url(#pages)" opacity="0.95"/>

  <!-- spine shadow -->
  <path d="M 64 28 L 64 96 L 62 98 L 62 30 Z" fill="#2a1e40" opacity="0.6"/>

  <!-- page line details (left) -->
  <g stroke="#a09080" stroke-width="0.8" opacity="0.4">
    <line x1="32" y1="42" x2="56" y2="43"/>
    <line x1="32" y1="48" x2="56" y2="49"/>
    <line x1="32" y1="54" x2="52" y2="55"/>
    <line x1="32" y1="60" x2="56" y2="61"/>
    <line x1="32" y1="66" x2="50" y2="67"/>
    <line x1="32" y1="72" x2="56" y2="73"/>
    <line x1="32" y1="78" x2="54" y2="79"/>
    <line x1="32" y1="84" x2="56" y2="85"/>
  </g>

  <!-- page line details (right) -->
  <g stroke="#a09080" stroke-width="0.8" opacity="0.4">
    <line x1="72" y1="43" x2="96" y2="42"/>
    <line x1="72" y1="49" x2="96" y2="48"/>
    <line x1="72" y1="55" x2="96" y2="54"/>
    <line x1="72" y1="61" x2="96" y2="60"/>
    <line x1="72" y1="67" x2="96" y2="66"/>
    <line x1="72" y1="73" x2="94" y2="72"/>
    <line x1="72" y1="79" x2="96" y2="78"/>
    <line x1="72" y1="85" x2="96" y2="84"/>
  </g>

  <!-- glowing runes rising from the book -->
  <g filter="url(#softGlow)">
    <!-- central rune -->
    <circle cx="64" cy="55" r="3" fill="#ffb74d"/>
    <!-- surrounding runes -->
    <circle cx="50" cy="48" r="1.8" fill="#b388ff"/>
    <circle cx="78" cy="48" r="1.8" fill="#b388ff"/>
    <circle cx="44" cy="38" r="1.5" fill="#ffb74d" opacity="0.8"/>
    <circle cx="84" cy="38" r="1.5" fill="#ffb74d" opacity="0.8"/>
    <circle cx="64" cy="35" r="1.5" fill="#b388ff"/>
    <!-- sparkle trails -->
    <circle cx="40" cy="28" r="1" fill="#ffb74d" opacity="0.6"/>
    <circle cx="88" cy="28" r="1" fill="#ffb74d" opacity="0.6"/>
    <circle cx="64" cy="22" r="1.2" fill="#b388ff" opacity="0.5"/>
    <circle cx="54" cy="26" r="0.8" fill="#ffb74d" opacity="0.5"/>
    <circle cx="74" cy="26" r="0.8" fill="#ffb74d" opacity="0.5"/>
  </g>

  <!-- soft glow behind runes -->
  <ellipse cx="64" cy="40" rx="30" ry="20" fill="url(#runeGlow)" opacity="0.5"/>

  <!-- book corner decorations (gold studs) -->
  <circle cx="26" cy="34" r="1.5" fill="#ffb74d" opacity="0.7"/>
  <circle cx="102" cy="34" r="1.5" fill="#ffb74d" opacity="0.7"/>
  <circle cx="26" cy="96" r="1.5" fill="#ffb74d" opacity="0.7"/>
  <circle cx="102" cy="96" r="1.5" fill="#ffb74d" opacity="0.7"/>
</svg>
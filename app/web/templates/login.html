{% extends "base.html" %}
{% block title %}Login — Open Grimoire{% endblock %}
{% block content %}
<div class="rpg-card rpg-login-card">
  <img src="/static/logo.svg" alt="Open Grimoire" class="rpg-login-logo">
  <p class="rpg-meta" style="text-align:center; margin-top:0.5rem; margin-bottom:1.5rem;">Sign in to search your RPG manuals</p>
  {% if error %}<p class="rpg-error" style="text-align:center;">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p>
      <label class="rpg-label">Username</label>
      <input type="text" name="username" required autofocus>
    </p>
    <p style="margin-top:1rem;">
      <label class="rpg-label">Password</label>
      <input type="password" name="password" required>
    </p>
    <p style="margin-top:1.5rem;">
      <button type="submit" class="rpg-btn" style="width:100%;">Enter the Library</button>
    </p>
  </form>
</div>
{% endblock %}

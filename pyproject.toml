[project]
name = "open-grimoire"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.7",
    "click>=8.1",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "simpleeval>=0.9.13",
    "markdown>=3.7",
    "slowapi>=0.1.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fpdf2>=2.7",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: requires real Ollama instance running on localhost:11434",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
# Bundle Jinja templates and static assets so a non-editable install (e.g.
# the Docker runtime image) ships them inside site-packages/app/.
app = ["web/templates/*.html", "web/static/*"]

[tool.mypy]
# `mypy --strict app/` passes cleanly across all 45 source files. The flags
# below are kept for the default (non-strict) invocation and as a safety net.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Third-party libs that ship no type stubs.
module = ["yaml", "markdown", "simpleeval", "pytesseract"]
ignore_missing_imports = true
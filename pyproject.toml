[project]
name = "rpg-master"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.7",
    "click>=8.1",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "simpleeval>=0.9.13",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fpdf2>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: requires real Ollama instance running on localhost:11434",
]

[tool.setuptools]
packages = ["app"]
ollama:
  host: http://localhost:11434

models:
  query: deepseek-v4-flash:0731-cloud
  # Give enrich a model distinct from `query`: enrichment runs in a
  # background thread, but Ollama serves one request per model at a time —
  # sharing a model makes chat queue behind enrichment.
  enrich: phi4-mini:3.8b
  structure: deepseek-v4-flash:0731-cloud
  vision: gemma3:4b

options:
  num_ctx: 16384

paths:
  data_dir: ./data
  db_dir: ./db

server:
  host: 0.0.0.0
  port: 8050
  # secret: must be set via SESSION_SECRET env var in production
  # or set DEV_MODE=1 to allow development without a secret

# All values above can be overridden by environment variables:
#   OLLAMA_HOST, SESSION_SECRET, DATA_DIR, DB_DIR, HOST, PORT, COOKIE_SECURE, DEV_MODE
#   ALLOW_REGISTRATION=1 — enable self-registration (pending approval)
services:
  prod:
    build: .
    container_name: open-grimoire-prod
    ports:
      - "8050:8050"
    volumes:
      - ./data-prod:/app/data
      - ./db-prod:/app/db
      - ./config-prod.yaml:/app/config.yaml:ro
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-0}
      - HOST=0.0.0.0
      - PORT=8050
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  test:
    build: .
    container_name: open-grimoire-test
    ports:
      - "8051:8051"
    volumes:
      - ./data-test:/app/data
      - ./db-test:/app/db
      - ./config-test.yaml:/app/config.yaml:ro
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SESSION_SECRET=${TEST_SESSION_SECRET:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-0}
      - HOST=0.0.0.0
      - PORT=8051
      # Test/staging is served over plain HTTP locally — Secure cookies
      # would never be sent, breaking login (CSRF double-submit).
      - COOKIE_SECURE=0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8051/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
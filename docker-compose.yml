services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      # DATA_DIR and DB_DIR are set in the Dockerfile to /app/data and /app/db
      # Override here if needed:
      # - DATA_DIR=/app/data
      # - DB_DIR=/app/db
    volumes:
      - app-data:/app/data
      - app-db:/app/db
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # If you have an NVIDIA GPU, uncomment these lines:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  app-data:
  app-db:
  ollama-models: